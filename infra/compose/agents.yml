# Agents d'observabilite : presents sur CHAQUE machine (inclus automatiquement par scripts/compose.sh).
name: resilience

networks:
  obs:

services:
  promtail:
    image: grafana/promtail:3.2.1
    networks: [obs]
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    environment:
      LOKI_URL: ${LOKI_URL:-http://loki:3100}   # multi-machines : http://<ip-machine-ops>:3100
    volumes:
      - ./infra/monitoring/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro   # lecture des logs, confine a promtail
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    networks: [obs]
    ports:
      - "${AGENT_BIND:-127.0.0.1}:8081:8080"   # multi-machines : IP privee, lue par Prometheus
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped
