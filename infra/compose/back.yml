# Machine BACK : metier (API, auth) + base PostgreSQL. La base n'est jamais publiee.
name: resilience

networks:
  app:
  obs:

volumes:
  db-data:

secrets:
  db_password:
    file: ./.secrets/db_password
  jwt_secret:
    file: ./.secrets/jwt_secret
  face_service_key:                      # meme valeur que SERVICE_KEY cote IA (serveur de reconnaissance faciale)
    file: ./.secrets/face_service_key
  canary_password:                       # meme valeur que cote canary (ops) : auth en derive le hash du compte "canary"
    file: ./.secrets/canary_password
  synthetic_probe_token:                 # meme valeur que cote canary (ops) : jeton de la transaction de controle
    file: ./.secrets/synthetic_probe_token

services:
  db:
    image: postgres:16-alpine
    networks: [app]                      # aucun port publie
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./dev/api
    networks: [app, obs]                 # obs : Prometheus scrute /metrics (mono-hote ; multi-machines : par IP)
    ports:
      - "${BACK_BIND:-0.0.0.0}:${API_PORT:-8000}:8000"   # multi-machines : IP privee, filtree au seul WAF
    environment:
      DB_HOST: db
      DB_NAME: payments
      DB_USER: payments
      DB_PASSWORD_FILE: /run/secrets/db_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      SYNTHETIC_PROBE_TOKEN_FILE: /run/secrets/synthetic_probe_token
      AUTH_URL: http://auth:8000          # la transaction de controle verifie auth (/auth/health) avant de payer
    secrets: [db_password, jwt_secret, synthetic_probe_token]
    depends_on:
      db: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }   # limite volontaire : l'attaque doit pouvoir saturer l'API
    restart: unless-stopped

  auth:
    build: ./dev/auth
    networks: [app]
    ports:
      - "${BACK_BIND:-0.0.0.0}:${AUTH_PORT:-8001}:8000"
    environment:
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      CANARY_PASSWORD_FILE: /run/secrets/canary_password   # cree le compte "canary" de la sonde
      # Controle facial : desactive par defaut (auth se comporte comme avant). Passer FACE_ENFORCE=true dans .env pour l'exiger.
      FACE_ENFORCE: ${FACE_ENFORCE:-false}
      FACE_SERVICE_URL: ${FACE_SERVICE_URL:-}   # ex. http://<ip-pc-hote>:8600 ; vide = pas de service IA
      FACE_SERVICE_KEY_FILE: /run/secrets/face_service_key
    secrets: [jwt_secret, canary_password, face_service_key]   # pas de base de donnees : auth n'a besoin que des secrets de signature et du canary
    restart: unless-stopped
