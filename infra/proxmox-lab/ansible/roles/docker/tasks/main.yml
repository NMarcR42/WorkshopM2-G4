- name: Répertoire des clés APT
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Clé GPG du dépôt Docker
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Dépôt officiel Docker
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: "https://download.docker.com/linux/{{ ansible_distribution | lower }}"
    suites: "{{ ansible_distribution_release }}"
    components: stable
    architectures: amd64
    signed_by: /etc/apt/keyrings/docker.asc

- name: Docker Engine + plugin Compose
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Configuration du démon Docker
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    mode: "0644"
    content: "{{ docker_daemon | to_nice_json }}\n"
  vars:
    docker_daemon:
      log-driver: json-file
      log-opts: { max-size: 10m, max-file: "3" }
      live-restore: true
      default-address-pools:
        - { base: 10.200.0.0/16, size: 24 }
  register: docker_conf

- name: Redémarrage de Docker si la configuration a changé
  ansible.builtin.service:
    name: docker
    state: restarted
  when: docker_conf.changed

- name: Docker démarré au boot
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Répertoire du projet
  ansible.builtin.file:
    path: "{{ base_dir }}"
    state: directory
    mode: "0755"
