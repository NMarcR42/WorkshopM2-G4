- name: Répertoire de la stack IA
  ansible.builtin.file:
    path: "{{ base_dir }}/ia"
    state: directory
    mode: "0755"

- name: Stack Ollama
  ansible.builtin.copy:
    dest: "{{ base_dir }}/ia/docker-compose.yml"
    mode: "0644"
    content: |
      # Ollama — vm-ia (géré par Ansible). L'API 11434 n'est autorisée que depuis vm-ops (pare-feu Proxmox).
      name: ia
      services:
        ollama:
          image: {{ images.ollama }}
          container_name: ra-ollama
          ports:
            - "11434:11434"
          environment:
            OLLAMA_KEEP_ALIVE: 24h
            OLLAMA_NUM_PARALLEL: "1"
          volumes:
            - ollama-data:/root/.ollama
          restart: unless-stopped
          mem_limit: 14g
      volumes:
        ollama-data:

- name: Démarrage d'Ollama
  community.docker.docker_compose_v2:
    project_src: "{{ base_dir }}/ia"
    state: present
    pull: missing

- name: Téléchargement des modèles choisis par l'équipe IA
  ansible.builtin.command: "docker exec ra-ollama ollama pull {{ item }}"
  loop: "{{ ollama_models }}"
  changed_when: false
