# Disponibilité : conteneur neuf depuis l'image d'origine (état interne corrompu, conteneur disparu)
# ansible-playbook recreate.yml -e service=api
- name: Remédiation — recréation de {{ service }}
  hosts: vm-app
  gather_facts: false
  tasks:
    - name: Contrôle du paramètre
      ansible.builtin.assert:
        that: service is defined and service in remediable_services

    - name: Recréation via la liste blanche
      ansible.builtin.command: "sudo -n /usr/local/sbin/ra-remediate recreate {{ service }}"
      changed_when: true

    - name: Vérification
      ansible.builtin.include_tasks: tasks/verify.yml
      vars:
        verify_service: "{{ service }}"
