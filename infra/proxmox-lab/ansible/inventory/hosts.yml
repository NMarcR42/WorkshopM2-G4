# Inventaire PROJECT RESILIENCE-ALPHA — Proxmox "pve" (192.168.1.89)
# vmid = identifiant Proxmox (utilisé pour les snapshots et le pare-feu)
all:
  vars:
    ansible_user: ansible
    ansible_python_interpreter: /usr/bin/python3
  children:
    app:
      hosts:
        vm-app:
          ansible_host: 192.168.1.24
          vmid: 200
    obs:
      hosts:
        vm-obs:
          ansible_host: 192.168.1.142
          vmid: 201
    ops:
      hosts:
        vm-ops:
          ansible_host: 192.168.1.151
          ansible_connection: local   # Ansible est exécuté depuis vm-ops
          vmid: 202
    ia:
      hosts:
        vm-ia:
          ansible_host: 192.168.1.152
          vmid: 203
    sauv:
      hosts:
        vm-sauv:
          ansible_host: 192.168.1.9
          vmid: 204
