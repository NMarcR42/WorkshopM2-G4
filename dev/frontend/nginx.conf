server {
    listen 80;
    root /usr/share/nginx/html;

    # Sonde de vie (comme /health des autres services).
    location = /health {
        default_type text/plain;
        return 200 "ok";
    }

    # Fichiers compilés : le nom contient un hash, on peut les garder longtemps en cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Application monopage : toute autre URL renvoie index.html.
    location / {
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }
}
